kind = "web"
previewPath = "/"
title = "Devansh Goyal Portfolio"
description = "A responsive personal portfolio for Devansh Goyal, a B.Tech CSE student specializing in AI and ML, featuring his education, skills, projects, achievements, and contact details."
version = "1.0.0"
id = "artifacts/devansh-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21452

[services.development]
run = "pnpm --filter @workspace/devansh-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devansh-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/devansh-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21452"
BASE_PATH = "/"
